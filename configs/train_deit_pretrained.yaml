run_name: deit_pretrained
model_arch: deit_small_patch16_224
pretrained: true
pretrained_cfg: fb_in1k
resume_from_checkpoint: null
init_mode: pretrained
num_classes: auto
image_size: 224
batch_size: 64
epochs: 30
optimizer: adamw
lr_backbone: 3.0e-5
lr_head: 1.0e-4
weight_decay: 0.05
scheduler: cosine
warmup_epochs: 2
early_stopping: false
early_stopping_metric: val_worst_context_accuracy
fallback_early_stopping_metric: val_macro_f1
patience: 5
augmentation: strong
save_every_epoch: true
seed: 42
